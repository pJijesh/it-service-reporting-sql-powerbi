<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Service level performance by month</title>
<desc id="d">Line chart of the percentage of tickets meeting their response and resolution targets, by month, from December 2024 to November 2025.</desc>
